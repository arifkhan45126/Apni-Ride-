<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apni Ride</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
}

h2{margin-top:0}

input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:#111827;
  color:white;
  border:0;
  font-weight:bold;
}

button.green{background:#16a34a}
button.red{background:#dc2626}
button.blue{background:#2563eb}

.status{
  padding:12px;
  border-radius:10px;
  background:#eef2ff;
  margin:10px 0;
}

.ride{
  border:1px solid #ddd;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
}

.hidden{display:none}

.small{
  font-size:13px;
  color:#666;
}

#map{
  height:320px;
  border-radius:15px;
  margin-top:12px;
}

.fare{
  background:#ecfdf5;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  font-size:17px;
}

.loading{
  padding:10px;
  text-align:center;
}
</style>
</head>

<body>

<header>
<h1>🚕 Apni Ride</h1>
<div>Passenger + Driver</div>
</header>

<div class="container">

<!-- ROLE -->
<div class="card" id="roleBox">

<h2>Select Mode</h2>

<button class="blue" onclick="showPassenger()">
👤 Passenger
</button>

<button onclick="showDriver()">
🚕 Driver
</button>

</div>


<!-- PASSENGER -->
<div id="passenger" class="hidden">

<div class="card">

<h2>👤 Book Your Ride</h2>

<input id="pName"
placeholder="Passenger Name">

<input id="pPhone"
placeholder="Mobile Number"
type="tel">

<input id="pickup"
placeholder="Pickup Location">

<input id="drop"
placeholder="Drop Location">

<button class="blue"
onclick="findRoute()">
🗺️ Find Route
</button>

<div id="map"></div>

<div id="routeInfo"></div>

<select id="vehicle"
onchange="calculateFare()">

<option value="Bike">🏍️ Bike</option>
<option value="Auto">🛺 Auto</option>
<option value="Car">🚗 Car</option>

</select>

<div id="fareBox"></div>

<button class="green"
onclick="bookRide()">

🚕 Book Ride

</button>

<div id="bookingStatus"></div>

</div>

</div>


<!-- DRIVER -->
<div id="driver" class="hidden">

<div class="card">

<h2>🚕 Driver Dashboard</h2>

<input id="driverName"
placeholder="Driver Name">

<button class="green"
onclick="goOnline()">

🟢 Go Online

</button>

<button class="red"
onclick="goOffline()">

🔴 Go Offline

</button>

<div id="driverStatus"
class="status">

Driver Offline

</div>

</div>


<div class="card">

<h2>📥 Ride Requests</h2>

<div id="rideRequests">
Waiting for ride requests...
</div>

</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
FIREBASE
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyD6u_Xa4YdDwMT8zoFZrO1dn6Qurc6pmcg",

authDomain:
"apni-ride-c23f3.firebaseapp.com",

databaseURL:
"https://apni-ride-c23f3-default-rtdb.firebaseio.com",

projectId:
"apni-ride-c23f3",

storageBucket:
"apni-ride-c23f3.firebasestorage.app",

messagingSenderId:
"537555369746",

appId:
"1:537555369746:web:5f5226a0eb5c8d8b83fdcb",

measurementId:
"G-22LLYKLYE3"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* =========================
MAP VARIABLES
========================= */

let map=null;

let routeLayer=null;

let pickupCoords=null;

let dropCoords=null;

let distanceKm=0;


/* =========================
PASSENGER
========================= */

window.showPassenger=function(){

document.getElementById("roleBox")
.classList.add("hidden");

document.getElementById("passenger")
.classList.remove("hidden");

initMap();

};


/* =========================
DRIVER
========================= */

window.showDriver=function(){

document.getElementById("roleBox")
.classList.add("hidden");

document.getElementById("driver")
.classList.remove("hidden");

listenForRides();

};


/* =========================
MAP
========================= */

function initMap(){

if(map) return;

map=L.map("map").setView(
[20.4140,72.8328],
13
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

}


/* =========================
GEOCODING
========================= */

async function getCoordinates(place){

const url=
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
+encodeURIComponent(place);

const response=await fetch(url);

const data=await response.json();

if(!data.length){

throw new Error(
"Location nahi mili: "+place
);

}

return[
parseFloat(data[0].lat),
parseFloat(data[0].lon)
];

}


/* =========================
FIND ROUTE
========================= */

window.findRoute=async function(){

const pickup=
document.getElementById("pickup")
.value.trim();

const drop=
document.getElementById("drop")
.value.trim();

if(!pickup || !drop){

alert("Pickup aur Drop dono bharo.");

return;

}

const info=
document.getElementById("routeInfo");

info.innerHTML=
'<div class="loading">🔎 Route find ho raha hai...</div>';

try{

pickupCoords=
await getCoordinates(pickup);

dropCoords=
await getCoordinates(drop);


const routeUrl=
"https://router.project-osrm.org/route/v1/driving/"
+
pickupCoords[1]+","+pickupCoords[0]
+
";"
+
dropCoords[1]+","+dropCoords[0]
+
"?overview=full&geometries=geojson";


const response=
await fetch(routeUrl);

const data=
await response.json();


if(data.code!=="Ok"){

throw new Error("Route nahi mila.");

}


const route=data.routes[0];

distanceKm=
route.distance/1000;


if(routeLayer){

map.removeLayer(routeLayer);

}


routeLayer=
L.geoJSON(
route.geometry
).addTo(map);


map.fitBounds(
routeLayer.getBounds(),
{padding:[20,20]}
);


L.marker(pickupCoords)
.addTo(map)
.bindPopup("📍 Pickup")
.openPopup();


L.marker(dropCoords)
.addTo(map)
.bindPopup("🏁 Drop");


info.innerHTML=

'<div class="status">'+
'📏 Distance: <b>'+
distanceKm.toFixed(2)+
' km</b>'+
'</div>';


calculateFare();

}catch(error){

info.innerHTML=
'<div class="status">'+
'❌ '+error.message+
'</div>';

}

};


/* =========================
FARE
========================= */

window.calculateFare=function(){

if(!distanceKm){

document.getElementById("fareBox")
.innerHTML="";

return;

}

const vehicle=
document.getElementById("vehicle").value;


let base=0;

let perKm=0;


if(vehicle==="Bike"){

base=30;
perKm=10;

}

if(vehicle==="Auto"){

base=40;
perKm=14;

}

if(vehicle==="Car"){

base=60;
perKm=18;

}


let fare=
Math.round(
base+(distanceKm*perKm)
);


document.getElementById("fareBox")
.innerHTML=

'<div class="fare">'+
'💰 Estimated Fare: <b>₹'+
fare+
'</b><br>'+
'<span class="small">'+
vehicle+
' • '+
distanceKm.toFixed(2)+
' km</span>'+
'</div>';

};


/* =========================
BOOK RIDE
========================= */

window.bookRide=async function(){

const name=
document.getElementById("pName")
.value.trim();

const phone=
document.getElementById("pPhone")
.value.trim();

const pickup=
document.getElementById("pickup")
.value.trim();

const drop=
document.getElementById("drop")
.value.trim();

const vehicle=
document.getElementById("vehicle")
.value;


if(
!name ||
!phone ||
!pickup ||
!drop
){

alert("Please sab details bharo.");

return;

}


if(!distanceKm){

alert(
"Pehle Find Route dabao."
);

return;

}


let base=0;

let perKm=0;


if(vehicle==="Bike"){

base=30;
perKm=10;

}

if(vehicle==="Auto"){

base=40;
perKm=14;

}

if(vehicle==="Car"){

base=60;
perKm=18;

}


const fare=
Math.round(
base+(distanceKm*perKm)
);


const rideRef=
push(ref(db,"rides"));


const ride={

rideId:rideRef.key,

passengerName:name,

phone:phone,

pickup:pickup,

drop:drop,

vehicle:vehicle,

distanceKm:
Number(distanceKm.toFixed(2)),

fare:fare,

status:"requested",

driverName:"",

createdAt:Date.now()

};


try{

await set(
rideRef,
ride
);


document.getElementById(
"bookingStatus"
).innerHTML=

'<div class="status">'+

'✅ <b>Ride Request Sent!</b>'+
'<br><br>'+

'Booking ID:<br>'+
'<b>'+rideRef.key+'</b>'+

'<br><br>'+

'📏 Distance: '+
distanceKm.toFixed(2)+
' km<br>'+

'💰 Fare: ₹'+
fare+

'<br><br>'+

'🚕 Driver ko request bhej di gayi hai.'+

'</div>';


listenPassengerStatus(
rideRef.key
);


}catch(error){

alert(
"Booking error: "+
error.message
);

}

};


/* =========================
PASSENGER STATUS
========================= */

function listenPassengerStatus(rideId){

const rideRef=
ref(db,"rides/"+rideId);

onValue(
rideRef,
(snapshot)=>{

const ride=snapshot.val();

if(!ride)return;


if(ride.status==="accepted"){

document.getElementById(
"bookingStatus"
).innerHTML=

'<div class="status">'+

'🟢 <b>Driver Accepted!</b>'+
'<br><br>'+

'Driver: '+
(ride.driverName||"Driver")+

'<br><br>'+

'🚕 Aapki ride accept ho gayi hai.'+

'</div>';

}


if(ride.status==="started"){

document.getElementById(
"bookingStatus"
).innerHTML=

'<div class="status">'+

'🚕 <b>Ride Started</b>'+
'<br><br>'+

'Driver: '+
(ride.driverName||"Driver")+

'</div>';

}


if(ride.status==="completed"){

document.getElementById(
"bookingStatus"
).innerHTML=

'<div class="status">'+

'✅ <b>Ride Completed</b>'+

'</div>';

}


if(ride.status==="rejected"){

document.getElementById(
"bookingStatus"
).innerHTML=

'<div class="status">'+

'❌ <b>Ride Rejected</b>'+

'<br><br>'+
'Driver ne ride accept nahi ki.'+

'</div>';

}

});

}


/* =========================
DRIVER ONLINE
========================= */

window.goOnline=function(){

const name=
document.getElementById(
"driverName"
).value.trim();


if(!name){

alert(
"Pehle driver name bharo."
);

return;

}


document.getElementById(
"driverStatus"
).innerHTML=

"🟢 Driver Online — Ride requests dekh raha hai.";

};


/* =========================
DRIVER OFFLINE
========================= */

window.goOffline=function(){

document.getElementById(
"driverStatus"
).innerHTML=

"🔴 Driver Offline";

};


/* =========================
RIDE REQUESTS
========================= */

function listenForRides(){

const ridesRef=
ref(db,"rides");

onValue(
ridesRef,
(snapshot)=>{

const data=snapshot.val();

const box=
document.getElementById(
"rideRequests"
);

box.innerHTML="";


if(!data){

box.innerHTML=
"Abhi koi ride request nahi hai.";

return;

}


let found=false;


Object.values(data)
.reverse()
.forEach(ride=>{

if(
ride.status!=="requested"
)return;


found=true;


const div=
document.createElement("div");

div.className="ride";


div.innerHTML=

'<b>🚕 New Ride Request</b>'+

'<br><br>'+

'👤 Passenger: '+
ride.passengerName+

'<br>'+

'📞 Mobile: '+
ride.phone+

'<br>'+

'📍 Pickup: '+
ride.pickup+

'<br>'+

'🏁 Drop: '+
ride.drop+

'<br>'+

'🚗 Vehicle: '+
ride.vehicle+

'<br>'+

'📏 Distance: '+
(ride.distanceKm||0)+
' km'+

'<br>'+

'💰 Fare: ₹'+
(ride.fare||0)+

'<br><br>'+

'<button class="green" '+
'onclick="acceptRide(\''+
ride.rideId+
'\')">'+

'✅ Accept Ride'+

'</button>'+

'<button class="red" '+
'onclick="rejectRide(\''+
ride.rideId+
'\')">'+

'❌ Reject'+

'</button>';


box.appendChild(div);

});


if(!found){

box.innerHTML=
"Abhi koi new ride request nahi hai.";

}

});

}


/* =========================
ACCEPT
========================= */

window.acceptRide=
async function(rideId){

const driverName=
document.getElementById(
"driverName"
).value.trim();


if(!driverName){

alert(
"Driver name bharo."
);

return;

}


await update(
ref(db,"rides/"+rideId),

{

status:"accepted",

driverName:driverName

}

);


alert(
"✅ Ride Accepted!"
);

};


/* =========================
REJECT
========================= */

window.rejectRide=
async function(rideId){

await update(
ref(db,"rides/"+rideId),

{

status:"rejected"

}

);

};

</script>

</body>
</html>
