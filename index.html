<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apni Ride</title>

<link

<style>

}

body{

  font-family:Arial,sans-serif;

header h1{

header p{

}

.card{
  background:white;

input,
select{
  width:100%;

  margin:6px 0;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}

button{

  padding:13px;
  margin-top:8px;

}

.orange{
  background:#ea580c;
}

.gray{

}

.hidden{

.status{

#map,
#driverMap{

}

  border:1px solid #ddd;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
}

.stars{
  text-align:center;
  margin:15px 0;
}

.star{
  display:inline-block;
  font-size:38px;
  cursor:pointer;
  margin:0 3px;
}

.ratingText{

  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🚕 Apni Ride</h1>
  <p>Ride Booking App</p>
</header>

<div class="container">

<!-- HOME -->

<div class="card" id="home">

  <h2>Choose Mode</h2>

  <button onclick="showPassenger()">
    👤 Passenger
  </button>

  <button class="orange" onclick="showDriver()">
    👨‍✈️ Driver
  </button>

</div>


<!-- PASSENGER -->

<div id="passenger" class="hidden">

  <div class="card">

    <h2>🚕 Book Ride</h2>

    <input
      id="passengerName"
      placeholder="Passenger Name"
    >

    <input
      id="passengerPhone"
      placeholder="Mobile Number"
      type="tel"
    >

    <input
      id="pickup"
      placeholder="Pickup Location"
    >

    <input
      id="drop"
      placeholder="Drop Location"
    >

    <select id="vehicle">
      <option value="bike">🏍️ Bike</option>
      <option value="auto">🛺 Auto</option>
      <option value="car">🚗 Car</option>
    </select>

    <button onclick="calculateRoute()">

    </button>

    <div id="routeInfo" class="status">
      Distance: -
    </div>

    <button class="green" onclick="bookRide()">

    </button>

    <button class="gray" onclick="goHome()">
      ⬅️ Back

  <div class="card">
    <div id="map"></div>

    <h2>📋 My Ride</h2>

          class="star"

        <span
          class="star"
          onclick="selectRating(2)"
        >☆</span>

        <span
          class="star"
          onclick="selectRating(3)"
        >☆</span>

        <span
          class="star"
          onclick="selectRating(4)"
        >☆</span>

        <span
          class="star"
          onclick="selectRating(5)"
        >☆</span>

      </div>

      >
        Rating select karo
      </div>

      <button
        class="green"
        onclick="submitRating()"

</div>


<!-- DRIVER -->

<div id="driver" class="hidden">

  <div class="card">

    <h2>👨‍✈️ Driver Dashboard</h2>

      class="status"

      🔴 Driver Offline
    </div>

    <button
      class="green"
      onclick="goOnline()"
    >
      🟢 Go Online
    </button>

    <button
      class="red"
      onclick="goOffline()"
    >
      🔴 Go Offline
    </button>

    <button
      class="gray"
      onclick="goHome()"
    >
      ⬅️ Back

  </div>

  <div class="card">

    <h3>📍 Driver Location</h3>

    <div id="driverMap"></div>

  </div>

  <div class="card">

    <h2>🚕 Ride Requests</h2>

    <div id="rideRequests">

    </div>

  </div>

</div>

</div>


<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  onValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyD6u_Xa4YdDwMT8zoFZrO1dn6Qurc6pmcg",
  authDomain: "apni-ride-c23f3.firebaseapp.com",
  databaseURL: "https://apni-ride-c23f3-default-rtdb.firebaseio.com",
  projectId: "apni-ride-c23f3",
  storageBucket: "apni-ride-c23f3.firebasestorage.app",
  messagingSenderId: "537555369746",
  appId: "1:537555369746:web:5f5226a0eb5c8d8b83fdcb"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* VARIABLES */

let map = null;
let driverMap = null;

let routeLine = null;
let pickupMarker = null;
let dropMarker = null;
let passengerDriverMarker = null;
let driverMarker = null;

let pickupCoords = null;
let dropCoords = null;

let lastDistance = 0;
let lastFare = 0;

let currentRideId = null;
let currentRating = 0;

let locationWatch = null;


/* HOME */

window.goHome = function(){

  document
    .getElementById("home")
    .classList.remove("hidden");

  document
    .getElementById("passenger")
    .classList.add("hidden");

  document
    .getElementById("driver")
    .classList.add("hidden");

};


/* PASSENGER */

window.showPassenger = function(){

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("driver")
    .classList.add("hidden");

  document
    .getElementById("passenger")
    .classList.remove("hidden");

  setTimeout(function(){

    createPassengerMap();

    map.invalidateSize();

  },300);

  listenDriverLocation();

};


/* DRIVER */

window.showDriver = function(){

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("passenger")
    .classList.add("hidden");

  document
    .getElementById("driver")
    .classList.remove("hidden");

  setTimeout(function(){

    createDriverMap();

    driverMap.invalidateSize();

  },300);

  listenRides();

};


/* PASSENGER MAP */

function createPassengerMap(){

  if(map) return;

  map = L.map("map").setView(
    [20.4283,72.8397],
    13
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

}


/* DRIVER MAP */

function createDriverMap(){

  if(driverMap) return;

  driverMap = L.map("driverMap").setView(
    [20.4283,72.8397],
    13
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(driverMap);

}


/* GEOCODE */

async function getLocation(address){

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json&limit=1&q=" +
    encodeURIComponent(address);

  const response =
    await fetch(url);

  const data =
    await response.json();

  if(!data.length){

    throw new Error(
      "Location not found"
    );

  }

  return [
    Number(data[0].lat),
    Number(data[0].lon)
  ];

}


/* ROUTE */

window.calculateRoute = async function(){

  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();

  const drop =
    document
      .getElementById("drop")
      .value
      .trim();

  if(!pickup || !drop){

    alert(
      "Pickup aur Drop location bharna hai."
    );

    return;

  }

  try{

    document
      .getElementById("routeInfo")
      .innerHTML =
      "⏳ Route calculate ho raha hai...";

    pickupCoords =
      await getLocation(pickup);

    dropCoords =
      await getLocation(drop);

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      pickupCoords[1] + "," +
      pickupCoords[0] + ";" +
      dropCoords[1] + "," +
      dropCoords[0] +
      "?overview=full&geometries=geojson";

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(
      !data.routes ||
      !data.routes.length
    ){

      alert("Route nahi mila.");

      return;

    }

    const route =
      data.routes[0];

    lastDistance =
      route.distance / 1000;

    const vehicle =
      document
        .getElementById("vehicle")
        .value;

    lastFare =
      calculateFare(
        vehicle,
        lastDistance
      );

    document
      .getElementById("routeInfo")
      .innerHTML =
      "📍 Distance: <b>" +
      lastDistance.toFixed(2) +
      " km</b><br>" +
      "💰 Fare: <b>₹" +
      lastFare +
      "</b>";


    if(routeLine)
      map.removeLayer(routeLine);

    if(pickupMarker)
      map.removeLayer(pickupMarker);

    if(dropMarker)
      map.removeLayer(dropMarker);


    routeLine =
      L.geoJSON(
        route.geometry
      ).addTo(map);


    pickupMarker =
      L.marker(pickupCoords)
      .addTo(map)
      .bindPopup("📍 Pickup");


    dropMarker =
      L.marker(dropCoords)
      .addTo(map)
      .bindPopup("🏁 Drop");


    map.fitBounds(
      routeLine.getBounds()
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Location nahi mili. Location ka naam dobara check karo."
    );

  }

};


/* FARE */

function calculateFare(
  vehicle,
  distance
){

  let base;
  let perKm;

  if(vehicle === "bike"){

    base = 30;
    perKm = 10;

  }
  else if(vehicle === "auto"){

    base = 40;
    perKm = 14;

  }
  else{

    base = 60;
    perKm = 18;

  }

  return Math.round(
    base + distance * perKm
  );

}


/* BOOK */

window.bookRide = async function(){

  const name =
    document
      .getElementById("passengerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("passengerPhone")
      .value
      .trim();

  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();

  const drop =
    document
      .getElementById("drop")
      .value
      .trim();

  const vehicle =
    document
      .getElementById("vehicle")
      .value;


  if(
    !name ||
    !phone ||
    !pickup ||
    !drop
  ){

    alert(
      "Sabhi details bharna zaroori hai."
    );

    return;

  }


  if(
    !pickupCoords ||
    !dropCoords
  ){

    alert(
      "Pehle Calculate Route dabao."
    );

    return;

  }


  try{

    const rideRef =
      push(ref(db,"rides"));

    currentRideId =
      rideRef.key;


    const ride = {

      id:currentRideId,

      passengerName:name,

      passengerPhone:phone,

      pickup:pickup,

      drop:drop,

      pickupLat:pickupCoords[0],

      pickupLng:pickupCoords[1],

      dropLat:dropCoords[0],

      dropLng:dropCoords[1],

      vehicle:vehicle,

      distanceKm:lastDistance,

      fare:lastFare,

      status:"requested",

      driverName:"",

      driverId:"",

      rating:0,

      createdAt:Date.now()

    };


    await set(
      rideRef,
      ride
    );


    showPassengerStatus(ride);


    alert(
      "🚕 Ride request sent!"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Ride booking error: " +
      error.message
    );

  }

};


/* PASSENGER STATUS */

function showPassengerStatus(ride){

  const box =
    document
      .getElementById("passengerStatus");


  if(ride.status === "requested"){

    box.innerHTML =
      "<div class='status'>" +
      "🕐 Driver ka wait ho raha hai..." +
      "<br>Fare: ₹" +
      ride.fare +
      "</div>";

  }


  else if(ride.status === "accepted"){

    box.innerHTML =
      "<div class='status'>" +
      "✅ Driver ne ride accept kar li." +
      "<br>Driver: " +
      (ride.driverName || "Demo Driver") +
      "</div>";

  }


  else if(ride.status === "started"){

    box.innerHTML =
      "<div class='status'>" +
      "▶️ Ride Started" +
      "<br>Driver: " +
      (ride.driverName || "Demo Driver") +
      "</div>";

  }


  else if(ride.status === "completed"){

    box.innerHTML =
      "<div class='status'>" +
      "🏁 Ride Completed" +
      "<br>Fare: ₹" +
      ride.fare +
      "</div>";

    document
      .getElementById("ratingBox")
      .classList.remove("hidden");

  }


  else if(ride.status === "rejected"){

    box.innerHTML =
      "<div class='status'>" +
      "❌ Ride rejected." +
      "</div>";

  }

}


/* LISTEN RIDES */

function listenRides(){

  onValue(
    ref(db,"rides"),
    function(snapshot){

      const data =
        snapshot.val();

      const box =
        document
          .getElementById("rideRequests");

      box.innerHTML = "";


      if(!data){

        box.innerHTML =
          "No ride requests";

        return;

      }


      Object.values(data)
      .forEach(function(ride){

        if(
          ride.status !== "completed" &&
          ride.status !== "rejected"
        ){

          const div =
            document.createElement("div");

          div.className = "ride";


          let buttons = "";


          if(
            ride.status === "requested"
          ){

            buttons =

              "<button class='green' " +
              "onclick=\"acceptRide('" +
              ride.id +
              "')\">" +
              "✅ Accept" +
              "</button>" +

              "<button class='red' " +
              "onclick=\"rejectRide('" +
              ride.id +
              "')\">" +
              "❌ Reject" +
              "</button>";

          }


          if(
            ride.status === "accepted"
          ){

            buttons =

              "<button class='orange' " +
              "onclick=\"startRide('" +
              ride.id +
              "')\">" +
              "▶️ Start Ride" +
              "</button>";

          }


          if(
            ride.status === "started"
          ){

            buttons =

              "<button class='green' " +
              "onclick=\"completeRide('" +
              ride.id +
              "')\">" +
              "🏁 Complete Ride" +
              "</button>";

          }


          div.innerHTML =

            "<b>👤 " +
            escapeHTML(
              ride.passengerName
            ) +
            "</b>" +

            "<p>📍 Pickup: " +
            escapeHTML(
              ride.pickup
            ) +
            "</p>" +

            "<p>🏁 Drop: " +
            escapeHTML(
              ride.drop
            ) +
            "</p>" +

            "<p>🚕 Vehicle: " +
            ride.vehicle +
            "</p>" +

            "<p>💰 Fare: ₹" +
            ride.fare +
            "</p>" +

            "<p>📌 Status: " +
            ride.status +
            "</p>" +

            buttons;


          box.appendChild(div);

        }

      });

    }
  );

}


/* ACCEPT */

window.acceptRide = async function(id){

  await update(
    ref(db,"rides/" + id),
    {
      status:"accepted",
      driverName:"Demo Driver",
      driverId:"demoDriver",
      acceptedAt:Date.now()
    }
  );

  alert(
    "✅ Ride Accepted"
  );

};


/* REJECT */

window.rejectRide = async function(id){

  await update(
    ref(db,"rides/" + id),
    {
      status:"rejected",
      rejectedAt:Date.now()
    }
  );

};


/* START */

window.startRide = async function(id){

  await update(
    ref(db,"rides/" + id),
    {
      status:"started",
      startedAt:Date.now()
    }
  );

  alert(
    "▶️ Ride Started"
  );

};


/* COMPLETE */

window.completeRide = async function(id){

  await update(
    ref(db,"rides/" + id),
    {
      status:"completed",
      completedAt:Date.now()
    }
  );

  alert(
    "🏁 Ride Completed"
  );

};


/* RATING */

window.selectRating = function(rating){

  currentRating =
    rating;

  const stars =
    document.querySelectorAll(
      ".star"
    );


  stars.forEach(
    function(star,index){

      star.innerText =
        index < rating
        ? "★"
        : "☆";

    }
  );


  document
    .getElementById("ratingText")
    .innerText =
    rating + " / 5 ⭐";

};


window.submitRating = async function(){

  if(!currentRating){

    alert(
      "Pehle star select karo."
    );

    return;

  }


  if(!currentRideId){

    alert(
      "Ride nahi mili."
    );

    return;

  }


  await update(
    ref(
      db,
      "rides/" + currentRideId
    ),
    {
      rating:currentRating,
      ratedAt:Date.now()
    }
  );


  document
    .getElementById("ratingText")
    .innerText =
    "✅ Rating submitted!";


};


/* DRIVER ONLINE */

window.goOnline = function(){

  if(!navigator.geolocation){

    alert(
      "Location supported nahi hai."
    );

    return;

  }


  document
    .getElementById("driverStatus")
    .innerText =
    "🟢 Driver Online";


  locationWatch =
    navigator.geolocation.watchPosition(

      async function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        await set(
          ref(
            db,
            "drivers/demoDriver"
          ),
          {
            name:"Demo Driver",
            lat:lat,
            lng:lng,
            online:true,
            updatedAt:Date.now()
          }
        );


        if(driverMap){

          if(driverMarker){

            driverMarker.setLatLng(
              [lat,lng]
            );

          }
          else{

            driverMarker =
              L.marker(
                [lat,lng]
              )
              .addTo(driverMap)
              .bindPopup(
                "🚕 Driver"
              );

          }


          driverMap.setView(
            [lat,lng],
            16
          );

        }

      },


      function(error){

        console.log(error);

        alert(
          "Location permission allow karo."
        );

      },


      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:10000
      }

    );

};


/* DRIVER OFFLINE */

window.goOffline = async function(){

  if(locationWatch !== null){

    navigator
      .geolocation
      .clearWatch(
        locationWatch
      );

    locationWatch = null;

  }


  await update(
    ref(
      db,
      "drivers/demoDriver"
    ),
    {
      online:false,
      updatedAt:Date.now()
    }
  );


  document
    .getElementById("driverStatus")
    .innerText =
    "🔴 Driver Offline";

};


/* DRIVER LOCATION TO PASSENGER */

function listenDriverLocation(){

  onValue(
    ref(
      db,
      "drivers/demoDriver"
    ),
    function(snapshot){

      const driver =
        snapshot.val();

      if(!driver)
        return;


      if(
        !driver.online
      ){

        if(
          passengerDriverMarker
        ){

          map.removeLayer(
            passengerDriverMarker
          );

          passengerDriverMarker =
            null;

        }

        return;

      }


      const position =
        [
          driver.lat,
          driver.lng
        ];


      if(
        passengerDriverMarker
      ){

        passengerDriverMarker
          .setLatLng(
            position
          );

      }
      else{

        passengerDriverMarker =
          L.marker(
            position
