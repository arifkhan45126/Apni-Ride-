<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apni Ride</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:18px;
}

header h1{
  margin:0;
  font-size:28px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.blue{
  background:#2563eb;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.black{
  background:#111827;
  color:white;
}

.hidden{
  display:none;
}

.vehicle{
  display:flex;
  gap:7px;
}

.vehicle button{
  background:#e5e7eb;
  color:#111;
}

.vehicle button.active{
  background:#2563eb;
  color:white;
}

.status{
  background:#eef2ff;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

#passengerMap,
#driverMap{
  height:300px;
  border-radius:12px;
  margin-top:10px;
}

.ride{
  border:1px solid #ddd;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>🚕 Apni Ride</h1>
<p>Book Your Ride Easily</p>
</header>

<div class="container">

<!-- HOME -->

<div id="home" class="card">

<h2>Choose Your Role</h2>

<button class="blue" onclick="showPassenger()">
👤 Passenger
</button>

<button class="black" onclick="showDriver()">
🚗 Driver
</button>

</div>


<!-- PASSENGER -->

<div id="passenger" class="hidden">

<div class="card">

<h2>👤 Book Ride</h2>

<input id="passengerName"
placeholder="Passenger Name">

<input id="passengerPhone"
placeholder="Mobile Number"
type="tel">

<input id="pickup"
placeholder="Pickup Location">

<input id="drop"
placeholder="Drop Location">


<h3>Choose Vehicle</h3>

<div class="vehicle">

<button id="bikeBtn"
onclick="selectVehicle('Bike')">
🏍️ Bike
</button>

<button id="autoBtn"
onclick="selectVehicle('Auto')">
🛺 Auto
</button>

<button id="carBtn"
onclick="selectVehicle('Car')">
🚗 Car
</button>

</div>


<div id="fareBox"
class="status">
Vehicle select karo
</div>


<button class="blue"
onclick="calculateRide()">
📍 Calculate Fare
</button>


<button class="green"
onclick="bookRide()">
🚕 Book Ride
</button>


<button class="black"
onclick="goHome()">
← Back
</button>

</div>


<div class="card">

<h2>🗺️ Map</h2>

<div id="passengerMap"></div>

</div>


<div id="passengerStatus"
class="card hidden">
</div>

</div>


<!-- DRIVER -->

<div id="driver" class="hidden">

<div class="card">

<h2>🚗 Driver Dashboard</h2>

<input id="driverName"
value="Demo Driver"
placeholder="Driver Name">


<button id="onlineBtn"
class="green"
onclick="toggleDriver()">
🟢 Go Online
</button>


<button class="black"
onclick="goHome()">
← Back
</button>


<div id="driverStatus"
class="status">
🔴 Driver Offline
</div>

</div>


<div class="card">

<h2>🗺️ Driver Location</h2>

<div id="driverMap"></div>

</div>


<div class="card">

<h2>📋 Ride Requests</h2>

<div id="rideRequests">
No ride requests
</div>

</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyD6u_XaY4dDwMT8zoFZrO1dn6Qurc6pmcg",

authDomain:
"apni-ride-c23f3.firebaseapp.com",

databaseURL:
"https://apni-ride-c23f3-default-rtdb.firebaseio.com",

projectId:
"apni-ride-c23f3",

storageBucket:
"apni-ride-c23f3.firebasestorage.app",

messagingSenderId:
"537555369746",

appId:
"1:537555369746:web:5f5226a0eb5c8d8b83fdcb"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* VARIABLES */

let selectedVehicle="";

let distance=5;

let fare=0;

let currentRideId=null;

let driverOnline=false;

let driverWatch=null;

let passengerMap=null;

let driverMap=null;

let driverMarker=null;


/* HOME */

window.showPassenger=function(){

document.getElementById("home")
.classList.add("hidden");

document.getElementById("driver")
.classList.add("hidden");

document.getElementById("passenger")
.classList.remove("hidden");

setTimeout(initPassengerMap,300);

};


window.showDriver=function(){

document.getElementById("home")
.classList.add("hidden");

document.getElementById("passenger")
.classList.add("hidden");

document.getElementById("driver")
.classList.remove("hidden");

setTimeout(initDriverMap,300);

listenRides();

};


window.goHome=function(){

document.getElementById("home")
.classList.remove("hidden");

document.getElementById("passenger")
.classList.add("hidden");

document.getElementById("driver")
.classList.add("hidden");

};


/* VEHICLE */

window.selectVehicle=function(vehicle){

selectedVehicle=vehicle;

document
.getElementById("bikeBtn")
.classList.remove("active");

document
.getElementById("autoBtn")
.classList.remove("active");

document
.getElementById("carBtn")
.classList.remove("active");


if(vehicle==="Bike"){

document
.getElementById("bikeBtn")
.classList.add("active");

}

if(vehicle==="Auto"){

document
.getElementById("autoBtn")
.classList.add("active");

}

if(vehicle==="Car"){

document
.getElementById("carBtn")
.classList.add("active");

}

calculateFare();

};


/* FARE */

function calculateFare(){

if(!selectedVehicle){

document.getElementById("fareBox")
.innerHTML="Vehicle select karo";

return;

}

let base=0;

let perKm=0;


if(selectedVehicle==="Bike"){

base=30;

perKm=10;

}


if(selectedVehicle==="Auto"){

base=40;

perKm=14;

}


if(selectedVehicle==="Car"){

base=60;

perKm=18;

}


fare=Math.round(
base+(distance*perKm)
);


document.getElementById("fareBox")
.innerHTML=

"Distance: "+distance+" km<br>"+
"<b>Fare: ₹"+fare+"</b>";

}


/* CALCULATE */

window.calculateRide=function(){

let pickup=
document.getElementById("pickup")
.value.trim();

let drop=
document.getElementById("drop")
.value.trim();


if(!pickup || !drop){

alert("Pickup aur Drop likho");

return;

}


if(!selectedVehicle){

alert("Vehicle select karo");

return;

}


/* DEMO DISTANCE */

distance=
Math.floor(Math.random()*8)+3;

calculateFare();

};


/* BOOK */

window.bookRide=async function(){

let name=
document.getElementById("passengerName")
.value.trim();

let phone=
document.getElementById("passengerPhone")
.value.trim();

let pickup=
document.getElementById("pickup")
.value.trim();

let drop=
document.getElementById("drop")
.value.trim();


if(!name ||
!phone ||
!pickup ||
!drop){

alert(
"Name, Mobile, Pickup aur Drop fill karo"
);

return;

}


if(!selectedVehicle){

alert("Vehicle select karo");

return;

}


calculateFare();


try{

const rideRef=
push(ref(db,"rides"));


currentRideId=rideRef.key;


await set(
rideRef,
{

passengerName:name,

passengerPhone:phone,

pickup:pickup,

drop:drop,

vehicle:selectedVehicle,

distanceKm:distance,

fare:fare,

status:"requested",

driverName:"",

createdAt:Date.now()

}
);


document
.getElementById("passengerStatus")
.classList.remove("hidden");


document
.getElementById("passengerStatus")
.innerHTML=

"<h3>🚕 Ride Booked</h3>"+
"<p>Ride ID: <b>"+
currentRideId+
"</b></p>"+
"<p>Status: Searching for driver...</p>";


listenPassengerRide();


alert("Ride Booked Successfully 🚕");


}catch(error){

console.error(error);

alert(
"Firebase error. Database rules check karo."
);

}

};


/* PASSENGER STATUS */

function listenPassengerRide(){

if(!currentRideId)return;


onValue(
ref(db,"rides/"+currentRideId),
(snapshot)=>{

const ride=snapshot.val();

if(!ride)return;


let html=

"<h3>🚕 Ride Status</h3>"+

"<p>Status: <b>"+
ride.status+
"</b></p>"+

"<p>Vehicle: "+
ride.vehicle+
"</p>"+

"<p>Fare: ₹"+
ride.fare+
"</p>";


if(ride.driverName){

html+=
"<p>Driver: <b>"+
ride.driverName+
"</b></p>";

}


if(ride.status==="completed"){

html+=`

<h3>⭐ Rate Ride</h3>

<button onclick="rateRide(1)">
⭐
</button>

<button onclick="rateRide(2)">
⭐⭐
</button>

<button onclick="rateRide(3)">
⭐⭐⭐
</button>

<button onclick="rateRide(4)">
⭐⭐⭐⭐
</button>

<button onclick="rateRide(5)">
⭐⭐⭐⭐⭐
</button>

`;

}


document
.getElementById("passengerStatus")
.innerHTML=html;

}

);

}


/* RATING */

window.rateRide=async function(rating){

if(!currentRideId)return;


await update(

ref(
db,
"rides/"+currentRideId
),

{
rating:rating
}

);


alert(
"Rating saved ⭐"
);

};


/* DRIVER ONLINE */

window.toggleDriver=function(){

driverOnline=!driverOnline;


let button=
document.getElementById("onlineBtn");

let status=
document.getElementById("driverStatus");


if(driverOnline){

button.innerHTML="🔴 Go Offline";

button.className="red";

status.innerHTML=
"🟢 Driver Online";

startDriverLocation();

}else{

button.innerHTML="🟢 Go Online";

button.className="green";

status.innerHTML=
"🔴 Driver Offline";

stopDriverLocation();

}

};


/* DRIVER LOCATION */

function startDriverLocation(){

if(!navigator.geolocation){

alert(
"Location supported nahi hai"
);

return;

}


driverWatch=
navigator.geolocation.watchPosition(

async(position)=>{

let lat=
position.coords.latitude;

let lng=
position.coords.longitude;


await set(

ref(
db,
"drivers/demoDriver"
),

{

name:
document
.getElementById("driverName")
.value ||
"Demo Driver",

lat:lat,

lng:lng,

online:true,

updatedAt:Date.now()

}

);


if(driverMap){

if(driverMarker){

driverMarker
.setLatLng([lat,lng]);

}else{

driverMarker=
L.marker([lat,lng])
.addTo(driverMap)
.bindPopup("🚗 Driver");

}

driverMap
.setView([lat,lng],15);

}

},

()=>{

alert(
"Location permission allow karo"
);

},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:10000

}

);

}


/* STOP LOCATION */

async function stopDriverLocation(){

if(driverWatch!==null){

navigator.geolocation
.clearWatch(driverWatch);

driverWatch=null;

}


await update(

ref(
db,
"drivers/demoDriver"
),

{
online:false
}

);

}


/* DRIVER REQUESTS */

function listenRides(){

onValue(

ref(db,"rides"),

(snapshot)=>{

let data=snapshot.val();

let box=
document.getElementById(
"rideRequests"
);


box.innerHTML="";


if(!data){

box.innerHTML=
"No ride requests";

return;

}


let found=false;


Object.keys(data)
.forEach(id=>{

let ride=data[id];


if(ride.status!=="requested")
return;


found=true;


let div=
document.createElement("div");

div.className="ride";


div.innerHTML=

"<b>🚕 New Ride</b>"+

"<p>Passenger: "+
ride.passengerName+
"</p>"+

"<p>📍 "+
ride.pickup+
"</p>"+

"<p>🏁 "+
ride.drop+
"</p>"+

"<p>🚗 "+
ride.vehicle+
"</p>"+

"<p>💰 ₹"+
ride.fare+
"</p>"+

"<button class='green' "+
"onclick=\"acceptRide('"+
id+
"')\">"+
"✅ Accept"+
"</button>"+

"<button class='red' "+
"onclick=\"rejectRide('"+
id+
"')\">"+
"❌ Reject"+
"</button>";


box.appendChild(div);

});


if(!found){

box.innerHTML=
"No new ride requests";

}

}

);

}


/* ACCEPT */

window.acceptRide=
async function(id){

let driverName=
document
.getElementById("driverName")
.value ||
"Demo Driver";


await update(

ref(
db,
"rides/"+id
),

{

status:"accepted",

driverName:driverName

}

);


alert(
"Ride Accepted 🚕"
);

};


/* REJECT */

window.rejectRide=
async function(id){

await update(

ref(
db,
"rides/"+id
),

{
status:"rejected"
}

);


alert(
"Ride Rejected"
);

};


/* DRIVER MAP */

function initDriverMap(){

if(driverMap)return;


driverMap=
L.map("driverMap")
.setView(
[20.42,72.83],
12
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:
"© OpenStreetMap"

}

).addTo(driverMap);

}


/* PASSENGER MAP */

function initPassengerMap(){

if(passengerMap)return;


passengerMap=
L.map("passengerMap")
.setView(
[20.42,72.83],
12
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:
"© OpenStreetMap"

}

).addTo(passengerMap);


if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

(position)=>{

let lat=
position.coords.latitude;

let lng=
position.coords.longitude;


L.marker([lat,lng])

.addTo(passengerMap)

.bindPopup(
"📍 Your Location"
)

.openPopup();


passengerMap
.setView(
[lat,lng],
15
);

}

);

}

}

</script>

</body>
</html>
