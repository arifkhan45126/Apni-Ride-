<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apni Ride</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  margin-top:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.green{
  background:#16a34a;
}

.red{
  background:#dc2626;
}

.orange{
  background:#ea580c;
}

.gray{
  background:#6b7280;
}

.hidden{
  display:none;
}

#map,#driverMap{
  height:350px;
  border-radius:12px;
  margin-top:12px;
}

.status{
  padding:12px;
  border-radius:8px;
  background:#eef2ff;
  margin-top:10px;
}

.ride{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.stars{
  display:flex;
  gap:7px;
  justify-content:center;
  margin:15px 0;
}

.star{
  font-size:35px;
  cursor:pointer;
}

.rating-text{
  text-align:center;
  font-weight:bold;
}

.small{
  font-size:13px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🚕 Apni Ride</h1>
  <p>Simple Ride Booking App</p>
</header>

<div class="container">

<!-- ROLE SELECTION -->
<div class="card" id="roleCard">
  <h2>Choose Mode</h2>

  <button onclick="showPassenger()">
    👤 Passenger
  </button>

  <button class="orange" onclick="showDriver()">
    👨‍✈️ Driver
  </button>
</div>


<!-- ================= PASSENGER ================= -->

<div id="passengerSection" class="hidden">

<div class="card">

<h2>🚕 Book Your Ride</h2>

<input id="passengerName"
placeholder="Passenger Name">

<input id="passengerPhone"
placeholder="Mobile Number">

<input id="pickup"
placeholder="Pickup Location">

<input id="drop"
placeholder="Drop Location">

<select id="vehicle">
  <option value="bike">🏍️ Bike</option>
  <option value="auto">🛺 Auto</option>
  <option value="car">🚗 Car</option>
</select>

<button onclick="calculateRoute()">
  🗺️ Calculate Route
</button>

<div id="routeInfo" class="status">
  Distance: -
</div>

<button class="green" onclick="bookRide()">
  🚕 Book Ride
</button>

<button class="gray" onclick="backHome()">
  ⬅️ Back
</button>

</div>

<div class="card">
  <div id="map"></div>
</div>

<div class="card">

<h2>📋 My Ride</h2>

<div id="passengerStatus">
  No active ride
</div>

<div id="ratingBox" class="hidden">

<h3>⭐ Rate Your Ride</h3>

<div class="stars">
  <span class="star" onclick="selectRating(1)">☆</span>
  <span class="star" onclick="selectRating(2)">☆</span>
  <span class="star" onclick="selectRating(3)">☆</span>
  <span class="star" onclick="selectRating(4)">☆</span>
  <span class="star" onclick="selectRating(5)">☆</span>
</div>

<div id="ratingText" class="rating-text">
  Select rating
</div>

<button class="green" onclick="submitRating()">
  ⭐ Submit Rating
</button>

</div>

</div>

</div>


<!-- ================= DRIVER ================= -->

<div id="driverSection" class="hidden">

<div class="card">

<h2>👨‍✈️ Driver Dashboard</h2>

<p id="driverStatus">
  Driver Offline
</p>

<button class="green" onclick="goOnline()">
  🟢 Go Online
</button>

<button class="red" onclick="goOffline()">
  🔴 Go Offline
</button>

<button class="gray" onclick="backHome()">
  ⬅️ Back
</button>

</div>

<div class="card">

<h3>📍 Driver Location</h3>

<div id="driverMap"></div>

</div>

<div class="card">

<h2>🚕 Ride Requests</h2>

<div id="rideRequests">
  No ride requests
</div>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import L from "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyD6u_Xa4YdDwMT8zoFZrO1dn6Qurc6pmcg",
  authDomain: "apni-ride-c23f3.firebaseapp.com",
  databaseURL: "https://apni-ride-c23f3-default-rtdb.firebaseio.com",
  projectId: "apni-ride-c23f3",
  storageBucket: "apni-ride-c23f3.firebasestorage.app",
  messagingSenderId: "537555369746",
  appId: "1:537555369746:web:5f5226a0eb5c8d8b83fdcb",
  measurementId: "G-22LLYKLYE3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ================= VARIABLES ================= */

let map;
let driverMap;

let pickupCoords = null;
let dropCoords = null;

let routeLine = null;
let pickupMarker = null;
let dropMarker = null;
let driverMarker = null;

let currentRideId = null;
let currentRideData = null;

let currentRating = 0;

let watchId = null;


/* ================= MAP ================= */

function createPassengerMap(){

  if(map) return;

  map = L.map("map").setView([20.4283,72.8397],13);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);
}


function createDriverMap(){

  if(driverMap) return;

  driverMap = L.map("driverMap").setView([20.4283,72.8397],13);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(driverMap);
}


/* ================= UI ================= */

window.showPassenger = function(){

  document.getElementById("roleCard").classList.add("hidden");

  document.getElementById("passengerSection")
  .classList.remove("hidden");

  createPassengerMap();

  setTimeout(()=>{
    map.invalidateSize();
  },300);

  listenForDriver();

};


window.showDriver = function(){

  document.getElementById("roleCard").classList.add("hidden");

  document.getElementById("driverSection")
  .classList.remove("hidden");

  createDriverMap();

  setTimeout(()=>{
    driverMap.invalidateSize();
  },300);

  listenForRides();

};


window.backHome = function(){

  document.getElementById("roleCard")
  .classList.remove("hidden");

  document.getElementById("passengerSection")
  .classList.add("hidden");

  document.getElementById("driverSection")
  .classList.add("hidden");

};


/* ================= GEOCODING ================= */

async function geocode(address){

  const url =
  "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
  +encodeURIComponent(address);

  const response = await fetch(url);

  const data = await response.json();

  if(!data.length){
    throw new Error("Location not found");
  }

  return [
    parseFloat(data[0].lat),
    parseFloat(data[0].lon)
  ];
}


/* ================= ROUTE ================= */

window.calculateRoute = async function(){

  const pickup =
  document.getElementById("pickup").value.trim();

  const drop =
  document.getElementById("drop").value.trim();

  if(!pickup || !drop){

    alert("Pickup aur Drop dono bharna hai.");

    return;
  }

  try{

    document.getElementById("routeInfo").innerText =
      "Calculating route...";

    pickupCoords = await geocode(pickup);

    dropCoords = await geocode(drop);

    const url =
      `https://router.project-osrm.org/route/v1/driving/`
      +`${pickupCoords[1]},${pickupCoords[0]};`
      +`${dropCoords[1]},${dropCoords[0]}`
      +`?overview=full&geometries=geojson`;

    const response = await fetch(url);

    const data = await response.json();

    if(!data.routes || !data.routes.length){

      alert("Route nahi mila.");

      return;
    }

    const route = data.routes[0];

    const distanceKm =
      route.distance / 1000;

    const vehicle =
      document.getElementById("vehicle").value;

    const fare =
      calculateFare(vehicle,distanceKm);

    document.getElementById("routeInfo").innerHTML =
      `Distance: <b>${distanceKm.toFixed(2)} km</b><br>
       Estimated Fare: <b>₹${fare}</b>`;

    if(routeLine){
      map.removeLayer(routeLine);
    }

    if(pickupMarker){
      map.removeLayer(pickupMarker);
    }

    if(dropMarker){
      map.removeLayer(dropMarker);
    }

    routeLine =
      L.geoJSON(route.geometry)
      .addTo(map);

    pickupMarker =
      L.marker(pickupCoords)
      .addTo(map)
      .bindPopup("Pickup")
      .openPopup();

    dropMarker =
      L.marker(dropCoords)
      .addTo(map)
      .bindPopup("Drop");

    map.fitBounds(routeLine.getBounds());

    window.lastDistanceKm = distanceKm;
    window.lastFare = fare;

  }catch(error){

    console.error(error);

    alert(
      "Location/route calculate nahi hua. Location ka naam dobara check karo."
    );

  }

};


/* ================= FARE ================= */

function calculateFare(vehicle,distance){

  let base = 0;
  let perKm = 0;

  if(vehicle === "bike"){

    base = 30;
    perKm = 10;

  }else if(vehicle === "auto"){

    base = 40;
    perKm = 14;

  }else{

    base = 60;
    perKm = 18;

  }

  return Math.round(base + distance * perKm);
}


/* ================= BOOK RIDE ================= */

window.bookRide = async function(){

  const name =
    document.getElementById("passengerName")
    .value.trim();

  const phone =
    document.getElementById("passengerPhone")
    .value.trim();

  const pickup =
    document.getElementById("pickup")
    .value.trim();

  const drop =
    document.getElementById("drop")
    .value.trim();

  const vehicle =
    document.getElementById("vehicle").value;


  if(!name || !phone || !pickup || !drop){

    alert("Saari details bharna zaroori hai.");

    return;
  }

  if(!pickupCoords || !dropCoords){

    alert("Pehle Calculate Route karo.");

    return;
  }

  const rideRef =
    push(ref(db,"rides"));

  currentRideId = rideRef.key;

  const rideData = {

    id: currentRideId,

    passengerName:name,

    passengerPhone:phone,

    pickup:pickup,

    drop:drop,

    pickupLat:pickupCoords[0],

    pickupLng:pickupCoords[1],

    dropLat:dropCoords[0],

    dropLng:dropCoords[1],

    vehicle:vehicle,

    distanceKm:window.lastDistanceKm || 0,

    fare:window.lastFare || 0,

    status:"requested",

    driverName:"",

    driverId:"",

    rating:0,

    createdAt:Date.now()

  };


  await set(rideRef,rideData);

  currentRideData = rideData;

  showPassengerStatus(rideData);

  alert(
    "Ride request bhej di gayi hai 🚕"
  );

};


/* ================= PASSENGER RIDE STATUS ================= */

function listenToRide(rideId){

  const rideRef =
    ref(db,"rides/"+rideId);

  onValue(rideRef,(snapshot)=>{

    const ride = snapshot.val();

    if(!ride) return;

    currentRideData = ride;

    showPassengerStatus(ride);

  });

}


function showPassengerStatus(ride){

  const box =
    document.getElementById("passengerStatus");

  let text = "";

  if(ride.status === "requested"){

    text =
      `🕐 Ride requested<br>
       Vehicle: ${ride.vehicle}<br>
       Fare: ₹${ride.fare}`;

  }

  else if(ride.status === "accepted"){

    text =
      `✅ Driver accepted<br>
       Driver: ${ride.driverName || "Driver"}<br>
       Fare: ₹${ride.fare}`;

  }

  else if(ride.status === "started"){

    text =
      `▶️ Ride Started<br>
       Driver: ${ride.driverName || "Driver"}<br>
       Destination: ${ride.drop}`;

  }

  else if(ride.status === "completed"){

    text =
      `🏁 Ride Completed<br>
       Fare: ₹${ride.fare}`;

    document
      .getElementById("ratingBox")
      .classList.remove("hidden");

  }

  else if(ride.status === "rejected"){

    text =
      `❌ Driver ne ride reject kar di.`;

  }

  box.innerHTML =
    `<div class="status">${text}</div>`;

}


/* ================= DRIVER REQUESTS ================= */

function listenForRides(){

  const ridesRef =
    ref(db,"rides");

  onValue(ridesRef,(snapshot)=>{

    const data = snapshot.val();

    const box =
      document.getElementById("rideRequests");

    box.innerHTML = "";

    if(!data){

      box.innerText =
        "No ride requests";

      return;
    }

    Object.values(data).forEach(ride=>{

      if(
        ride.status === "requested" ||
        ride.status === "accepted" ||
        ride.status === "started"
      ){

        const div =
          document.createElement("div");

        div.className = "ride";

        div.innerHTML = `

          <b>👤 ${escapeHtml(ride.passengerName)}</b>

          <p>
          Pickup: ${escapeHtml(ride.pickup)}
          </p>

          <p>
          Drop: ${escapeHtml(ride.drop)}
          </p>

          <p>
          Vehicle: ${ride.vehicle}
          </p>

          <p>
          Distance: ${Number(ride.distanceKm).toFixed(2)} km
          </p>

          <p>
          Fare: ₹${ride.fare}
          </p>

          <p>
          Status: <b>${ride.status}</b>
          </p>

          ${
            ride.status === "requested"
            ?
            `
            <button class="green"
            onclick="acceptRide('${ride.id}')">
            ✅ Accept
            </button>

            <button class="red"
            onclick="rejectRide('${ride.id}')">
            ❌ Reject
            </button>
            `
            :
            ""
          }

          ${
            ride.status === "accepted"
            ?
            `
            <button class="orange"
            onclick="startRide('${ride.id}')">
            ▶️ Start Ride
            </button>
            `
            :
            ""
          }

          ${
            ride.status === "started"
            ?
            `
            <button class="green"
            onclick="completeRide('${ride.id}')">
            🏁 Complete Ride
            </button>
            `
            :
            ""
          }

        `;

        box.appendChild(div);

      }

    });

  });

}


/* ================= ACCEPT ================= */

window.acceptRide = async function(id){

  await update(
    ref(db,"rides/"+id),
    {
      status:"accepted",
      driverName:"Demo Driver",
      driverId:"demoDriver",
      acceptedAt:Date.now()
    }
  );

  alert("Ride accepted ✅");

};


/* ================= REJECT ================= */

window.rejectRide = async function(id){

  await update(
    ref(db,"rides/"+id),
    {
      status:"rejected",
      rejectedAt:Date.now()
    }
  );

};


/* ================= START ================= */

window.startRide = async function(id){

  await update(
    ref(db,"rides/"+id),
    {
      status:"started",
      startedAt:Date.now()
    }
  );

  alert("Ride Started ▶️");

};


/* ================= COMPLETE ================= */

window.completeRide = async function(id){

  await update(
    ref(db,"rides/"+id),
    {
      status:"completed",
      completedAt:Date.now()
    }
  );

  alert(
    "Ride Completed 🏁 Passenger ab rating de sakta hai."
  );

};


/* ================= RATING ================= */

window.selectRating = function(rating){

  currentRating = rating;

  const stars =
    document.querySelectorAll(".star");

  stars.forEach((star,index)=>{

    if(index < rating){

      star.innerText = "★";

    }else{

      star.innerText = "☆";

    }

  });

  document.getElementById("ratingText")
  .innerText =
    `${rating} / 5 ⭐`;

};


window.submitRating = async function(){

  if(!currentRating){

    alert("Pehle rating select karo.");

    return;
  }

  if(!currentRideId && currentRideData){

    currentRideId =
      currentRideData.id;

  }

  if(!currentRideId){

    alert("Active ride nahi mili.");

    return;
  }

  await update(
    ref(db,"rides/"+currentRideId),
    {
      rating:currentRating,
      ratedAt:Date.now()
    }
  );

  document.getElementById("ratingText")
  .innerText =
    "Thank you! Rating submit ho gayi ⭐";

  document.querySelectorAll(".star")
  .forEach(star=>{
    star.style.pointerEvents="none";
  });

};


/* ================= DRIVER ONLINE ================= */

window.goOnline = function(){

  document.getElementById("driverStatus")
  .innerText =
    "🟢 Driver Online";

  if(!navigator.geolocation){

    alert(
      "Is browser me location available nahi hai."
    );

    return;
  }

  watchId =
    navigator.geolocation.watchPosition(

      async position=>{

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        await set(
          ref(db,"drivers/demoDriver"),
          {
            name:"Demo Driver",
            lat:lat,
            lng:lng,
            online:true,
            updatedAt:Date.now()
          }
        );

        if(driverMap){

          driverMap.setView(
            [lat,lng],
            16
          );

          if(driverMarker){

            driverMarker.setLatLng(
              [lat,lng]
            );

          }else{

            driverMarker =
              L.marker([lat,lng])
              .addTo(driverMap)
              .bindPopup("🚕 Driver");

          }

        }

      },

      error=>{

        console.error(error);

        alert(
          "Location permission allow karo."
        );

      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:10000
      }

    );

};


window.goOffline = async function(){

  if(watchId !== null){

    navigator.geolocation
      .clearWatch(watchId);

    watchId = null;

  }

  await update(
    ref(db,"drivers/demoDriver"),
    {
      online:false,
      updatedAt:Date.now()
    }
  );

  document.getElementById("driverStatus")
  .innerText =
    "🔴 Driver Offline";

};


/* ================= LIVE DRIVER ON PASSENGER MAP ================= */

function listenForDriver(){

  const driverRef =
    ref(db,"drivers/demoDriver");

  onValue(driverRef,(snapshot)=>{

    const driver =
      snapshot.val();

    if(!driver) return;

    if(!driver.online){

      if(driverMarker){

        map.removeLayer(driverMarker);

        driverMarker = null;

      }

      return;
    }

    const position =
      [driver.lat,driver.lng];

    if(driverMarker){

      driverMarker.setLatLng(position);

    }else{

      driverMarker =
        L.marker(position)
        .addTo(map)
        .bindPopup("🚕 Your Driver");

    }

  });

}


/* ================= PASSENGER CURRENT RIDE ================= */

onValue(
  ref(db,"rides"),
  snapshot=>{

    const data = snapshot.val();

    if(!data) return;

    const rides =
      Object.values(data);

    const active =
      rides
      .filter(r =>
        r.status !== "rejected" &&
        r.status !== "completed"
      )
      .sort(
        (a,b)=>
        (b.createdAt||0)-
        (a.createdAt||0)
      )[0];

    if(active){

      currentRideId =
        active.id;

      currentRideData =
        active;

      showPassengerStatus(active);

      listenToRide(active.id);

    }

  }
);


/* ================= HTML SECURITY ================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
