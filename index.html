<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apni Ride</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 12px #ddd;
}

button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.blue{
  background:#2563eb;
  color:white;
}

.black{
  background:#111827;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.hidden{
  display:none;
}

#map{
  height:350px;
  border-radius:12px;
  margin-top:10px;
}

.ride{
  border:1px solid #ddd;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>🚕 Apni Ride</h1>
<p>Your Ride, Your Way</p>
</header>

<div class="container">

<!-- HOME -->

<div id="home" class="card">

<h2>Choose Mode</h2>

<button class="blue" onclick="showPassenger()">
👤 Passenger
</button>

<button class="black" onclick="showDriver()">
🚗 Driver
</button>

</div>


<!-- PASSENGER -->

<div id="passenger" class="hidden">

<div class="card">

<h2>👤 Passenger</h2>

<input
id="name"
placeholder="Your Name">

<input
id="phone"
placeholder="Mobile Number"
type="tel">

<input
id="pickup"
placeholder="Pickup Location">

<input
id="drop"
placeholder="Drop Location">


<h3>Vehicle</h3>

<button class="blue"
onclick="chooseVehicle('Bike')">
🏍️ Bike
</button>

<button class="blue"
onclick="chooseVehicle('Auto')">
🛺 Auto
</button>

<button class="blue"
onclick="chooseVehicle('Car')">
🚗 Car
</button>


<p id="vehicle">
Vehicle: Not Selected
</p>


<button class="green"
onclick="calculateFare()">
💰 Calculate Fare
</button>


<button class="black"
onclick="goHome()">
← Back
</button>

</div>


<div class="card">

<h2>🗺️ Map</h2>

<div id="map"></div>

</div>


<div id="result"
class="card hidden">
</div>

</div>


<!-- DRIVER -->

<div id="driver" class="hidden">

<div class="card">

<h2>🚗 Driver Dashboard</h2>

<input
id="driverName"
placeholder="Driver Name">

<button
id="onlineButton"
class="green"
onclick="toggleOnline()">
🟢 Go Online
</button>

<button class="black"
onclick="goHome()">
← Back
</button>

<p id="driverStatus">
🔴 Driver Offline
</p>

</div>


<div class="card">

<h2>📋 Ride Requests</h2>

<div id="rideRequests">
Driver ko online karo.
</div>

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyD6u_Xa4YdDwMT8zoFZrO1dn6Qurc6pmcg",

authDomain:
"apni-ride-c23f3.firebaseapp.com",

databaseURL:
"https://apni-ride-c23f3-default-rtdb.firebaseio.com",

projectId:
"apni-ride-c23f3",

storageBucket:
"apni-ride-c23f3.firebasestorage.app",

messagingSenderId:
"537555369746",

appId:
"1:537555369746:web:5f5226a0eb5c8d8b83fdcb"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);


/* VARIABLES */

let vehicle="";

let map=null;

let distance=5;

let fare=0;

let currentRideId=null;

let driverOnline=false;


/* PASSENGER */

window.showPassenger=function(){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("driver")
.classList.add("hidden");

document
.getElementById("passenger")
.classList.remove("hidden");


setTimeout(function(){

if(map) return;


map=L.map("map")
.setView([20.42,72.83],12);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

},300);

};


/* DRIVER */

window.showDriver=function(){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("passenger")
.classList.add("hidden");

document
.getElementById("driver")
.classList.remove("hidden");

listenRides();

};


/* HOME */

window.goHome=function(){

document
.getElementById("home")
.classList.remove("hidden");

document
.getElementById("passenger")
.classList.add("hidden");

document
.getElementById("driver")
.classList.add("hidden");

};


/* VEHICLE */

window.chooseVehicle=function(type){

vehicle=type;

document
.getElementById("vehicle")
.innerHTML=
"Vehicle: <b>"+type+"</b>";

};


/* FARE */

window.calculateFare=function(){

let name=
document.getElementById("name").value.trim();

let phone=
document.getElementById("phone").value.trim();

let pickup=
document.getElementById("pickup").value.trim();

let drop=
document.getElementById("drop").value.trim();


if(!name || !phone || !pickup || !drop){

alert(
"Name, Mobile, Pickup aur Drop fill karo"
);

return;

}


if(!vehicle){

alert("Vehicle select karo");

return;

}


/* Demo distance */

distance=
Math.floor(Math.random()*8)+3;


if(vehicle==="Bike"){
fare=30+(distance*10);
}

if(vehicle==="Auto"){
fare=40+(distance*14);
}

if(vehicle==="Car"){
fare=60+(distance*18);
}


fare=Math.round(fare);


document
.getElementById("result")
.classList.remove("hidden");


document
.getElementById("result")
.innerHTML=

"<h2>🚕 Ride Details</h2>"+

"<p>Name: <b>"+name+"</b></p>"+

"<p>Pickup: <b>"+pickup+"</b></p>"+

"<p>Drop: <b>"+drop+"</b></p>"+

"<p>Vehicle: <b>"+vehicle+"</b></p>"+

"<p>Distance: <b>"+distance+
" km</b></p>"+

"<h2>Estimated Fare: ₹"+
fare+
"</h2>"+

"<button class='green' "+
"onclick='bookRide()'>"+
"🚕 Book Ride"+
"</button>";

};


/* BOOK RIDE */

window.bookRide=async function(){

let name=
document.getElementById("name").value.trim();

let phone=
document.getElementById("phone").value.trim();

let pickup=
document.getElementById("pickup").value.trim();

let drop=
document.getElementById("drop").value.trim();


if(!name || !phone || !pickup || !drop){

alert("Sab details fill karo");

return;

}


if(!vehicle){

alert("Vehicle select karo");

return;

}


try{

const rideRef=
push(ref(db,"rides"));


currentRideId=
rideRef.key;


await set(
rideRef,
{

passengerName:name,

passengerPhone:phone,

pickup:pickup,

drop:drop,

vehicle:vehicle,

distanceKm:distance,

fare:fare,

status:"requested",

driverName:"",

createdAt:Date.now()

}
);


document
.getElementById("result")
.innerHTML=

"<h2>✅ Ride Booked</h2>"+

"<p>Ride ID:</p>"+

"<b>"+currentRideId+"</b>"+

"<p>🚕 Driver search ho raha hai...</p>";


listenMyRide();


}catch(error){

console.error(error);

alert(
"Firebase error: "+
error.message
);

}

};


/* PASSENGER STATUS */

function listenMyRide(){

if(!currentRideId) return;


onValue(

ref(
db,
"rides/"+currentRideId
),

(snapshot)=>{

const ride=snapshot.val();

if(!ride) return;


document
.getElementById("result")
.innerHTML=

"<h2>🚕 Ride Status</h2>"+

"<p>Status: <b>"+
ride.status+
"</b></p>"+

"<p>Vehicle: "+
ride.vehicle+
"</p>"+

"<p>Fare: ₹"+
ride.fare+
"</p>"+

(
ride.driverName
?
"<p>Driver: <b>"+
ride.driverName+
"</b></p>"
:
""
);

}

);

}


/* DRIVER ONLINE */

window.toggleOnline=function(){

driverOnline=
!driverOnline;


const button=
document.getElementById("onlineButton");

const status=
document.getElementById("driverStatus");


if(driverOnline){

button.innerHTML=
"🔴 Go Offline";

button.className="red";

status.innerHTML=
"🟢 Driver Online";


listenRides();


}else{

button.innerHTML=
"🟢 Go Online";

button.className="green";

status.innerHTML=
"🔴 Driver Offline";

}

};


/* DRIVER RIDE REQUESTS */

function listenRides(){

onValue(

ref(db,"rides"),

(snapshot)=>{

const data=snapshot.val();

const box=
document.getElementById("rideRequests");


if(!driverOnline){

box.innerHTML=
"Driver Offline";

return;

}


box.innerHTML="";


if(!data){

box.innerHTML=
"No ride requests";

return;

}


let found=false;


Object.keys(data)
.forEach(id=>{

const ride=data[id];


if(ride.status!=="requested")
return;


found=true;


const div=
document.createElement("div");

div.className="ride";


div.innerHTML=

"<h3>🚕 New Ride</h3>"+

"<p>Passenger: <b>"+
ride.passengerName+
"</b></p>"+

"<p>📍 Pickup: "+
ride.pickup+
"</p>"+

"<p>🏁 Drop: "+
ride.drop+
"</p>"+

"<p>🚗 Vehicle: "+
ride.vehicle+
"</p>"+

"<p>💰 Fare: ₹"+
ride.fare+
"</p>"+

"<button class='green' "+
"onclick=\"acceptRide('"+
id+
"')\">"+
"✅ Accept Ride"+
"</button>"+

"<button class='red' "+
"onclick=\"rejectRide('"+
id+
"')\">"+
"❌ Reject"+
"</button>";


box.appendChild(div);

});


if(!found){

box.innerHTML=
"No new ride requests";

}

}

);

}


/* ACCEPT */

window.acceptRide=
async function(id){

let driverName=
document
.getElementById("driverName")
.value.trim();


if(!driverName){

alert(
"Driver Name pehle likho"
);

return;

}


await update(

ref(
db,
"rides/"+id
),

{

status:"accepted",

driverName:driverName

}

);


alert(
"✅ Ride Accepted"
);

};


/* REJECT */

window.rejectRide=
async function(id){

await update(

ref(
db,
"rides/"+id
),

{
status:"rejected"
}

);


alert(
"Ride Rejected"
);

};

</script>

</body>
</html>
