/* =========================

const firebaseConfig = {

 databaseURL: "https://apni-ride-c23f3-default-rtdb.firebaseio.com",
 projectId: "apni-ride-c23f3",

 appId: "1:537555369746:web:5f5226a0eb5c8d8b83fdcb",

};

/* =========================
   VARIABLES
========================= */

let vehicle = "";
let distance = 0;
let fare = 0;
let duration = 0;

let currentRideId = "";

let pickupCoords = null;

/* =========================
   MAP INIT
========================= */

function initMap(){

 if(map) return;

 map = L.map("map")
 .setView(
   [20.5937,78.9629],
   5
 );

 L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
   maxZoom:19,
   attribution:"© OpenStreetMap"
 }
 ).addTo(map);
}


function initDriverMap(){

 if(driverMap) return;

 driverMap = L.map("driverMap")
 .setView(
   [20.5937,78.9629],
   5
 );

 L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
   maxZoom:19,
   attribution:"© OpenStreetMap"
 }
 ).addTo(driverMap);
}


/* =========================
   GEOCODING
========================= */

async function geocode(place){

 const url =
 "https://nominatim.openstreetmap.org/search" +
 "?format=json&limit=1&q=" +
 encodeURIComponent(place);

 const response =
 await fetch(url);

 if(!response.ok)
   throw new Error("Location search failed");

 const data =
 await response.json();

 if(!data.length)
   throw new Error(
     "Location nahi mili: " + place
   );

 return {
   lat:parseFloat(data[0].lat),
   lng:parseFloat(data[0].lon),
   name:data[0].display_name
 };
}


/* =========================
   REAL ROUTE
========================= */

window.findRoute = async function(){

 const pickup =
 document.getElementById("pickup")
 .value.trim();

 const drop =
 document.getElementById("drop")
 .value.trim();


 if(!pickup || !drop){

   alert("Pickup aur Drop dono bharo");
   return;
 }


 if(!map)
   initMap();


 document.getElementById(
 "routeLoading"
 ).innerHTML =
 `
 <div class="loading">
 ⏳ Route calculate ho raha hai...
 </div>
 `;

 document.getElementById(
 "routeInfo"
 ).innerHTML = "";


 try{

   pickupCoords =
   await geocode(pickup);

   dropCoords =
   await geocode(drop);


   /* Pickup marker */

   if(pickupMarker)
     map.removeLayer(pickupMarker);

   pickupMarker =
   L.marker([
     pickupCoords.lat,
     pickupCoords.lng
   ])
   .addTo(map)
   .bindPopup("📍 Pickup")
   .openPopup();


   /* Drop marker */

   if(dropMarker)
     map.removeLayer(dropMarker);

   dropMarker =
   L.marker([
     dropCoords.lat,
     dropCoords.lng
   ])
   .addTo(map)
   .bindPopup("🏁 Drop");


   /* OSRM route */

   const routeUrl =
   "https://router.project-osrm.org/route/v1/driving/" +
   pickupCoords.lng + "," +
   pickupCoords.lat + ";" +
   dropCoords.lng + "," +
   dropCoords.lat +
   "?overview=full&geometries=geojson";


   const response =
   await fetch(routeUrl);


   if(!response.ok)
     throw new Error("Route service error");


   const data =
   await response.json();


   if(
     !data.routes ||
     !data.routes.length
   ){

     throw new Error(
       "Road route nahi mili"
     );

   }


   const route =
   data.routes[0];


   /* KM */

   distance =
   route.distance / 1000;


   /* Minutes */

   duration =
   Math.round(route.duration / 60);


   /* Route line */

   if(routeLine)
     map.removeLayer(routeLine);


   routeLine =
   L.geoJSON(
     route.geometry,
     {
       style:{
         weight:6
       }
     }
   ).addTo(map);


   /* Map fit */

   map.fitBounds(
     routeLine.getBounds(),
     {
       padding:[30,30]
     }
   );


   document.getElementById(
   "routeLoading"
   ).innerHTML = "";


   document.getElementById(
   "routeInfo"
   ).innerHTML =
   `
   <div class="routeInfo">

     <b>🛣️ Actual Route Found</b>

     <p>
     📏 Distance:
     <b>${distance.toFixed(2)} KM</b>
     </p>

     <p>
     ⏱️ Estimated Time:
     <b>${duration} minutes</b>
     </p>

   </div>
   `;


   /* Fare automatically calculate */

   calculateFare();


 }catch(error){

   document.getElementById(
   "routeLoading"
   ).innerHTML = "";

   alert(
     "Route Error: " +
     error.message
   );

 }

};


/* =========================
   VEHICLE
========================= */

window.chooseVehicle = function(type){

 vehicle = type;

 document.getElementById("bikeBtn")
 .classList.remove("selected");

 document.getElementById("autoBtn")
 .classList.remove("selected");

 document.getElementById("carBtn")
 .classList.remove("selected");


 if(type === "Bike")
 document.getElementById("bikeBtn")
 .classList.add("selected");


 if(type === "Auto")
 document.getElementById("autoBtn")
 .classList.add("selected");


 if(type === "Car")
 document.getElementById("carBtn")
 .classList.add("selected");


 if(distance > 0)
 calculateFare();

};


/* =========================
   REAL FARE
========================= */

window.calculateFare = function(){

 if(!vehicle){

   alert("Pehle vehicle select karo");
   return;
 }


 if(!distance){

   alert(
     "Pehle Pickup aur Drop ka Route Calculate karo"
   );

   return;
 }


 /*
   Fare formula:
   Bike = ₹30 + ₹10/km
   Auto = ₹40 + ₹14/km
   Car = ₹60 + ₹18/km
 */

 if(vehicle === "Bike"){

   fare =
   Math.round(
     30 + distance * 10
   );

 }


 if(vehicle === "Auto"){

   fare =
   Math.round(
     40 + distance * 14
   );

 }


 if(vehicle === "Car"){

   fare =
   Math.round(
     60 + distance * 18
   );

 }


 document.getElementById(
 "fareBox"
 ).innerHTML =
 `
 <div class="rideBox">

   <p>
   🚗 Vehicle:
   <b>${vehicle}</b>
   </p>

   <p>
   📏 Distance:
   <b>${distance.toFixed(2)} KM</b>
   </p>

   <p>
   ⏱️ Time:
   <b>${duration} minutes</b>
   </p>

   <p class="price">
   ₹${fare}
   </p>

 </div>
 `;

};


/* =========================
   BOOK RIDE
========================= */

window.bookRide = async function(){

 const name =
 document.getElementById(
 "pName"
 ).value.trim();

 const phone =
 document.getElementById(
 "pPhone"
 ).value.trim();

 const pickup =
 document.getElementById(
 "pickup"
 ).value.trim();

 const drop =
 document.getElementById(
 "drop"
 ).value.trim();


 if(
   !name ||
   !phone ||
   !pickup ||
   !drop
 ){

   alert("Saari details bharo");
   return;
 }


 if(!vehicle){

   alert("Vehicle select karo");
   return;
 }


 if(!pickupCoords || !dropCoords){

   alert(
     "Pehle Route & Distance Calculate karo"
   );

   return;
 }


 if(!distance || !fare){

   alert(
     "Pehle Fare Calculate karo"
   );

   return;
 }


 try{

   const rideRef =
   push(ref(db,"rides"));

   currentRideId =
   rideRef.key;


   await set(
   rideRef,
   {

     passengerName:name,

     passengerPhone:phone,

     pickup:pickup,

     drop:drop,

     pickupLat:
     pickupCoords.lat,

     pickupLng:
     pickupCoords.lng,

     dropLat:
     dropCoords.lat,

     dropLng:
     dropCoords.lng,

     vehicle:vehicle,

     distanceKm:
     Number(distance.toFixed(2)),

     durationMin:
     duration,

     fare:fare,

     status:"requested",

     driverName:"",

     driverLat:null,

     driverLng:null,

     createdAt:Date.now()

   });


   document.getElementById(
   "passengerStatus"
   ).classList.remove("hidden");


   document.getElementById(
   "rideStatusText"
   ).innerHTML =
   "🟡 Driver ko ride request bheji gayi hai...";


   listenMyRide();


   alert(
     "🚕 Ride Request Sent!"
   );


 }catch(error){

   alert(
     "Firebase Error: " +
     error.message
   );

 }

};


/* =========================
   PASSENGER RIDE LISTENER
========================= */

function listenMyRide(){

 if(!currentRideId) return;


 const rideRef =
 ref(
   db,
   "rides/" +
   currentRideId
 );


 onValue(
 rideRef,
 snapshot=>{

   const ride =
   snapshot.val();

   if(!ride) return;


   const status =
   ride.status;


   const statusText =
   document.getElementById(
     "rideStatusText"
   );


   if(status === "requested"){

     statusText.innerHTML =
     "🟡 Driver ride request dekh raha hai...";

   }


   if(status === "accepted"){

     statusText.innerHTML =
     "🟢 Driver ne ride accept kar li!";


     document.getElementById(
     "driverInfo"
     ).innerHTML =
     `
     <div class="rideBox">

       🚗 Driver:
       <b>${ride.driverName}</b>

       <br><br>

       Vehicle:
       <b>${ride.vehicle}</b>

       <br><br>

       💰 Fare:
       <b>₹${ride.fare}</b>

     </div>
     `;


     document.getElementById(
     "startRideBtn"
     ).classList.remove("hidden");

   }


   if(status === "started"){

     statusText.innerHTML =
     "🚕 Ride Started";


     document.getElementById(
     "startRideBtn"
     ).classList.add("hidden");


     document.getElementById(
     "completeRideBtn"
     ).classList.remove("hidden");

   }


   if(status === "completed"){

     statusText.innerHTML =
     "✅ Ride Completed";


     document.getElementById(
     "completeRideBtn"
     ).classList.add("hidden");


     document.getElementById(
     "ratingBox"
     ).classList.remove("hidden");

   }


   if(status === "rejected"){

     statusText.innerHTML =
     "❌ Driver ne ride reject kar di.";

   }


   /* Driver location */

   if(
     ride.driverLat != null &&
     ride.driverLng != null
   ){

     updatePassengerDriverLocation(
       ride.driverLat,
       ride.driverLng
     );

   }

 });

}

window.toggleOnline = async function(){

 const name =
 document.getElementById(
 "driverName"
 ).value.trim();


 if(!name){

   alert("Driver name bharo");
   return;
 }


 driverOnline =
 !driverOnline;


 const driverRef =
 ref(
   db,
   "drivers/demoDriver"
 );


 if(driverOnline){

   await set(
   driverRef,
   {

     name:name,

     online:true,

     lat:null,

     lng:null,

     updatedAt:Date.now()

   });


   document.getElementById(
   "onlineBtn"
   ).innerHTML =
   "🔴 Go Offline";


   document.getElementById(
   "onlineBtn"
   ).classList.remove("green");


   document.getElementById(
   "onlineBtn"
   ).classList.add("red");


   document.getElementById(
   "driverStatus"
   ).innerHTML =
   "🟢 Driver Online";


 }else{

   await update(
   driverRef,
   {
     online:false
   });


   document.getElementById(
   "onlineBtn"
   ).innerHTML =
   "🟢 Go Online";


   document.getElementById(
   "onlineBtn"
   ).classList.remove("red");


   document.getElementById(
   "onlineBtn"
   ).classList.add("green");


   document.getElementById(
   "driverStatus"
   ).innerHTML =
   "🔴 Driver Offline";

 }

};


/* =========================
   DRIVER RIDE LIST
========================= */

function listenRides(){

 const ridesRef =
 ref(db,"rides");


 onValue(
 ridesRef,
 snapshot=>{

   const data =
   snapshot.val();

   const list =
   document.getElementById(
     "rideList"
   );


   if(!driverOnline){

     list.innerHTML =
     "🟡 Pehle Driver ko Online karo.";

     return;
   }


   if(!data){

     list.innerHTML =
     "Abhi koi ride request nahi hai.";

     return;
   }


   let html = "";


   Object.entries(data)
   .forEach(
   ([id,ride])=>{

     if(
       ride.status === "requested"
     ){

       html +=
       `
       <div class="rideBox">

       <h3>🚕 New Ride</h3>

       <p>
       👤 Passenger:
       <b>${ride.passengerName}</b>
       </p>

       <p>
       📍 Pickup:
       ${ride.pickup}
       </p>

       <p>
       🏁 Drop:
       ${ride.drop}
       </p>

       <p>
       📏 Distance:
       <b>
       ${ride.distanceKm} KM
       </b>
       </p>

       <p>
       ⏱️ Time:
       <b>
       ${ride.durationMin} min
       </b>
       </p>

       <p>
       🚗 Vehicle:
       <b>
       ${ride.vehicle}
       </b>
       </p>

       <p>
       💰 Fare:
       <b>
       ₹${ride.fare}
       </b>
       </p>

       <button
       class="green"
       onclick="acceptRide('${id}')">
       ✅ Accept
       </button>

       <button
       class="red"
       onclick="rejectRide('${id}')">
       ❌ Reject
       </button>

       </div>
       `;

     }

   });


   if(!html)
   html =
   "No new ride requests.";


   list.innerHTML =
   html;

 });

}

window.rejectRide = async f
